# Explicit empty workspace table: makes this crate its own workspace root so
# cargo never absorbs it into the desktop crate's tree (they share a repo but
# must build independently - see CLAUDE.md).
[workspace]

[package]
name = "conductor-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "conductor_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
iroh = "1.0.3"
log = "0.4"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
