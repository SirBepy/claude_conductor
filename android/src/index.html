<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conductor</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <div class="center-zone">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Conductor</h1>
      </div>

      <form id="setup-form" novalidate hidden>
        <div class="url-row">
          <input
            id="server-url"
            type="url"
            inputmode="url"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="https://your-pc.ts.net"
            aria-label="Server URL"
            required
          >
          <button type="submit" id="url-submit-btn" class="inline-check" aria-label="Connect">
            <span id="url-submit-check" aria-hidden="true">✓</span>
            <span class="spinner spinner-inline" id="url-submit-spinner" hidden aria-hidden="true"></span>
          </button>
        </div>
      </form>

      <p id="idle-error" class="field-error" hidden></p>
      <p id="error-url" class="server-url" hidden></p>
    </div>

    <div class="actions">
      <button type="button" id="scan-qr-btn">
        <span class="spinner spinner-inline" id="scan-qr-spinner" hidden aria-hidden="true"></span>
        <span id="scan-qr-label">Scan QR code</span>
      </button>

      <button type="button" id="manual-toggle-btn" class="link-btn">Enter address manually</button>
    </div>
  </main>
  <button id="scan-cancel-btn" class="scan-cancel" type="button" hidden>Cancel</button>
  <script src="./app.js"></script>
</body>
</html>
