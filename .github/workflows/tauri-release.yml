name: Tauri Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      android_changed: ${{ steps.android.outputs.android_changed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      product_name: ${{ steps.check.outputs.product_name }}
      product_slug: ${{ steps.check.outputs.product_slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: check
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          PRODUCT_NAME=$(jq -r .productName src-tauri/tauri.conf.json)
          PRODUCT_SLUG=$(echo "$PRODUCT_NAME" | tr ' ' '-')
          TAG="tauri-v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "product_name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"
          echo "product_slug=$PRODUCT_SLUG" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG not found. Will release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # The APK is a thin shell (pairing screens + iroh dialer) that loads the real
      # frontend live off the daemon, so ordinary src/ work never changes it. Only
      # rebuild it when android/ itself moved since the previous release tag. Runs
      # before the tag job, so the newest tag here is still the PREVIOUS release.
      - name: Check whether android/ changed since the last release
        id: android
        shell: bash
        run: |
          LAST_TAG=$(git tag -l 'tauri-v*' --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag; building Android."
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_TAG" HEAD -- android/; then
            echo "android/ unchanged since $LAST_TAG; skipping the Android build."
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "android/ changed since $LAST_TAG; building Android."
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

  build:
    needs: [check, tag]
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            updater_key: windows-x86_64
            os_label: windows
            arch_label: x64
          # macOS/Linux paused 2026-08-12; restore the three matrix entries from
          # this commit's parent to un-pause. The os-guarded staging steps below
          # stay put and simply never fire.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 89513f79 dropped package-lock.json and gitignored it, which silently broke
      # this job: setup-node's npm cache and `npm ci` both require that file.
      # pnpm-lock.yaml is the real lockfile; action-setup reads the pnpm version
      # from package.json's packageManager field and must run before setup-node.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: Sync version into tauri.conf.json, Cargo.toml, and package.json
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # tauri.conf.json: source of truth for Tauri bundler.
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          # Cargo.toml: only `^version = "..."` lines hit (deps use `  version = ...`
          # with leading whitespace inside inline tables). `-i.bak` is the form
          # both GNU sed (Linux) and BSD sed (macOS) accept.
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak
          # package.json: already the source of truth, write back to be explicit.
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Committed src-tauri/.cargo/config.toml pins build.target-dir to a
          # dev-machine-only D: path (be0d209f), which hid the bundle from the
          # staging steps and broke every 0.2.53 platform. Env outranks config.
          CARGO_TARGET_DIR: target
        working-directory: src-tauri
        # Invoke cargo-tauri directly, not `cargo tauri`. On macos-14 runners
        # `/opt/homebrew/bin/cargo` is a rustup-init shim that shadows the real
        # `~/.cargo/bin/cargo` and breaks subcommand dispatch with
        # "error: unexpected argument 'tauri' found / Usage: rustup-init".
        # Calling cargo-tauri (the actual binary installed by tauri-cli) skips
        # that lookup entirely.
        run: cargo-tauri build --target ${{ matrix.target }}

      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle/nsis
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          VERSION="${{ needs.check.outputs.version }}"
          SLUG="${{ needs.check.outputs.product_slug }}"
          mkdir -p "$GITHUB_WORKSPACE/release-staging"
          EXE_FILE=$(ls *_x64-setup.exe | head -n 1)
          ASSET="${SLUG}_${VERSION}_${{ matrix.os_label }}_${{ matrix.arch_label }}.exe"
          cp "$EXE_FILE" "$GITHUB_WORKSPACE/release-staging/$ASSET"
          cp "${EXE_FILE}.sig" "$GITHUB_WORKSPACE/release-staging/${ASSET}.sig"
          SIG=$(cat "${EXE_FILE}.sig")
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG}/${ASSET}"
          jq -n --arg sig "$SIG" --arg url "$URL" \
            '{signature:$sig, url:$url}' \
            > "$GITHUB_WORKSPACE/release-staging/${{ matrix.updater_key }}.json"

      - name: Stage macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          VERSION="${{ needs.check.outputs.version }}"
          SLUG="${{ needs.check.outputs.product_slug }}"
          mkdir -p "$GITHUB_WORKSPACE/release-staging"
          # Updater payload: .app.tar.gz + .sig (createUpdaterArtifacts=true).
          APP_TGZ=$(ls macos/*.app.tar.gz | head -n 1)
          ASSET_TGZ="${SLUG}_${VERSION}_${{ matrix.os_label }}_${{ matrix.arch_label }}.app.tar.gz"
          cp "$APP_TGZ" "$GITHUB_WORKSPACE/release-staging/$ASSET_TGZ"
          cp "${APP_TGZ}.sig" "$GITHUB_WORKSPACE/release-staging/${ASSET_TGZ}.sig"
          SIG=$(cat "${APP_TGZ}.sig")
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG}/${ASSET_TGZ}"
          jq -n --arg sig "$SIG" --arg url "$URL" \
            '{signature:$sig, url:$url}' \
            > "$GITHUB_WORKSPACE/release-staging/${{ matrix.updater_key }}.json"
          # DMG for first-time installs.
          DMG_FILE=$(ls dmg/*.dmg | head -n 1)
          ASSET_DMG="${SLUG}_${VERSION}_${{ matrix.os_label }}_${{ matrix.arch_label }}.dmg"
          cp "$DMG_FILE" "$GITHUB_WORKSPACE/release-staging/$ASSET_DMG"

      - name: Stage Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        working-directory: src-tauri/target/${{ matrix.target }}/release/bundle
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          VERSION="${{ needs.check.outputs.version }}"
          SLUG="${{ needs.check.outputs.product_slug }}"
          mkdir -p "$GITHUB_WORKSPACE/release-staging"
          # AppImage doubles as updater payload + portable run; signed in place.
          APPIMG=$(ls appimage/*.AppImage | head -n 1)
          ASSET_APP="${SLUG}_${VERSION}_${{ matrix.os_label }}_${{ matrix.arch_label }}.AppImage"
          cp "$APPIMG" "$GITHUB_WORKSPACE/release-staging/$ASSET_APP"
          cp "${APPIMG}.sig" "$GITHUB_WORKSPACE/release-staging/${ASSET_APP}.sig"
          SIG=$(cat "${APPIMG}.sig")
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG}/${ASSET_APP}"
          jq -n --arg sig "$SIG" --arg url "$URL" \
            '{signature:$sig, url:$url}' \
            > "$GITHUB_WORKSPACE/release-staging/${{ matrix.updater_key }}.json"
          # DEB for apt-managed installs.
          DEB=$(ls deb/*.deb | head -n 1)
          ASSET_DEB="${SLUG}_${VERSION}_${{ matrix.os_label }}_${{ matrix.arch_label }}.deb"
          cp "$DEB" "$GITHUB_WORKSPACE/release-staging/$ASSET_DEB"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.updater_key }}
          path: release-staging/

  android:
    needs: [check, tag]
    if: needs.check.outputs.should_release == 'true' && needs.check.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/src-tauri
          key: aarch64-linux-android
          cache-on-failure: true

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # android/ is its own workspace with its own version; keep the APK's
      # versionName in step with the release the same way the desktop job does.
      - name: Sync version into the android crate
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' android/src-tauri/tauri.conf.json > android/src-tauri/tauri.conf.json.tmp
          mv android/src-tauri/tauri.conf.json.tmp android/src-tauri/tauri.conf.json
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" android/src-tauri/Cargo.toml
          rm android/src-tauri/Cargo.toml.bak

      # gen/android/tauri.settings.gradle and generated/TauriActivity.kt are
      # gitignored and machine-specific, so a raw checkout can never build (gradle
      # fails with "Unresolved reference: TauriActivity"). init also rewrites the
      # tracked gradle/res files, so restore those immediately after.
      - name: Regenerate the gitignored Android codegen
        shell: bash
        working-directory: android
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo-tauri android init
          git checkout -- src-tauri/gen/android

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is unset, so this run builds a DEBUG apk and attaches nothing to the release. Set the four ANDROID_KEYSTORE_*/ANDROID_KEY_* secrets to ship a signed one."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/conductor-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/conductor-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # ring's build script cannot find the NDK clang without these four, and
          # the failure reads like a broken dependency. 28 matches minSdkVersion in
          # android/src-tauri/tauri.conf.json.
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cargo-tauri android build --target aarch64 --apk
          else
            cargo-tauri android build --target aarch64 --apk --debug
          fi

      - name: Stage APK
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          SLUG="${{ needs.check.outputs.product_slug }}"
          mkdir -p release-staging
          APK=$(find android/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found under app/build/outputs/apk" >&2
            exit 1
          fi
          cp "$APK" "release-staging/${SLUG}_${VERSION}_android_arm64.apk"

      # Named release-* so the publish job's download pattern picks it up. Staging
      # holds only the .apk: publish treats every *.json there as an updater
      # platform entry, and the APK has no updater channel.
      - name: Upload artifacts
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: release-staging/

      # Deliberately NOT release-*: an unsigned debug build must never reach the
      # release page, but it is still worth keeping for inspection.
      - name: Upload unsigned debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish:
    needs: [check, tag, build, android]
    # !cancelled() rather than success(): the android job is skipped on releases
    # that did not touch android/, and a skipped need would otherwise skip publish
    # too. The desktop build still has to have passed.
    if: ${{ !cancelled() && needs.check.outputs.should_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        working-directory: artifacts
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLATFORMS="{}"
          for f in *.json; do
            KEY="${f%.json}"
            PLATFORMS=$(jq --arg k "$KEY" --slurpfile p "$f" \
              '. + {($k): $p[0]}' <<< "$PLATFORMS")
          done
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $VERSION" \
            --arg pub_date "$DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > latest.json
          cat latest.json

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.exe.sig
            artifacts/*.app.tar.gz
            artifacts/*.app.tar.gz.sig
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.AppImage.sig
            artifacts/*.apk
            artifacts/latest.json
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.product_name }} v${{ needs.check.outputs.version }}
          draft: false
          make_latest: "true"
