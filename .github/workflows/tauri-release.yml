name: Tauri Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      android_changed: ${{ steps.android.outputs.android_changed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      product_name: ${{ steps.check.outputs.product_name }}
      product_slug: ${{ steps.check.outputs.product_slug }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and tag
        id: check
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          PRODUCT_NAME=$(jq -r .productName src-tauri/tauri.conf.json)
          PRODUCT_SLUG=$(echo "$PRODUCT_NAME" | tr ' ' '-')
          TAG="tauri-v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "product_name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"
          echo "product_slug=$PRODUCT_SLUG" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG not found. Will release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # The APK is a thin shell (pairing screens + iroh dialer) that loads the real
      # frontend live off the daemon, so ordinary src/ work never changes it. Only
      # rebuild it when android/ itself moved since the previous release tag. Runs
      # before the tag job, so the newest tag here is still the PREVIOUS release.
      - name: Check whether android/ changed since the last release
        id: android
        shell: bash
        run: |
          LAST_TAG=$(git tag -l 'tauri-v*' --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag; building Android."
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_TAG" HEAD -- android/; then
            echo "android/ unchanged since $LAST_TAG; skipping the Android build."
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "android/ changed since $LAST_TAG; building Android."
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Gates the tag, so a red check stops the release before anything is published
  # to the auto-updater. Runs alongside the builds rather than before them (each is
  # ~20 min): the tag and publish jobs wait on it, so a red test still ships
  # nothing and only costs one unused build. Fast checks only: the wdio e2e suite needs a built
  # binary and a display, and the 31 #[ignore]'d integration tests spawn a real
  # `claude`, so neither belongs in front of every push to master.
  test:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    # windows-latest, not ubuntu: Linux is a paused release target, so the crate
    # compiling there is unproven and a failure would be the runner's, not the
    # code's. Windows is a platform the release itself builds on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `../dist` is tauri.conf.json's frontendDist and is embedded at compile
      # time by RustEmbed, so it must exist before any cargo command or the
      # build fails as "../dist does not exist" - which reads like a broken path
      # rather than a missing frontend build. `vite build` alone is enough here;
      # `pnpm run build` would also rerun the export_types test via prebuild.
      - name: Build frontend
        run: pnpm exec vite build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip; the repo has no release tags, so a toolchain bump means re-resolving this sha by hand

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: test-x86_64-pc-windows-msvc
          cache-on-failure: true

      # src/types/ipc.generated.ts is gitignored and written by the export_types
      # test (ts-rs), so without it tsc fails on every `../types/ipc.generated`
      # import. One cargo invocation for both test targets, so the crate compiles
      # once instead of twice in a row; the types are written before Typecheck.
      # --lib only: the integration tests under src-tauri/tests/ are #[ignore]'d
      # and spawn a real daemon plus a real `claude`, which CI has no account for.
      # --no-fail-fast so a red lib test still lets export_types write the types.
      - name: Generate IPC types and run Rust unit tests
        env:
          # Committed src-tauri/.cargo/config.toml pins build.target-dir to a
          # dev-machine-only D: path. Env outranks config; without this the
          # target dir is unwritable here. Same trap that broke every 0.2.53
          # platform in the build job.
          CARGO_TARGET_DIR: target
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test export_types --no-fail-fast

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Check CSS custom properties
        run: pnpm run check:css-vars

      - name: Frontend unit tests
        run: pnpm vitest run --poolOptions.threads.maxThreads=5 --poolOptions.threads.minThreads=1

  # Waits on the Windows build too, so a failed Windows build never leaves an
  # orphan tag behind that makes `check` skip the next push's release of the same
  # version. macOS does not gate the tag: it ships later from publish-macos, and a
  # red macOS leg leaves a Windows-only release to rerun with `gh run rerun --failed`.
  tag:
    needs: [check, test, build-windows]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # The only job that pushes to the repo: the tag push below authenticates with
    # the checkout's persisted GITHUB_TOKEN, so it keeps both write and the
    # default persist-credentials.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.check.outputs.tag }}"
          git push origin "${{ needs.check.outputs.tag }}"

  # One call of the reusable desktop-build.yml per platform instead of a matrix, so
  # `tag` and `publish-windows` wait on the Windows build alone and macOS
  # publishes on its own via `publish-macos`. Intel macOS and Linux stay paused
  # (paused 2026-08-12, arm64 restored 2026-08-31): bringing one back takes another
  # call here, its own publish step for its assets (publish-windows and
  # publish-macos upload only their own file types), and a `needs` edge from
  # publish-macos so its latest.json entry is ready when that job rebuilds it.
  # Its os-guarded staging steps in desktop-build.yml already exist.
  build-windows:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      os: windows-latest
      target: x86_64-pc-windows-msvc
      updater_key: windows-x86_64
      os_label: windows
      arch_label: x64
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      product_slug: ${{ needs.check.outputs.product_slug }}

  build-macos:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/desktop-build.yml
    secrets: inherit
    with:
      os: macos-15
      target: aarch64-apple-darwin
      updater_key: darwin-aarch64
      os_label: macos
      arch_label: arm64
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      product_slug: ${{ needs.check.outputs.product_slug }}

  android:
    needs: check
    if: needs.check.outputs.should_release == 'true' && needs.check.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip; the repo has no release tags, so a toolchain bump means re-resolving this sha by hand
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: android/src-tauri
          key: aarch64-linux-android
          cache-on-failure: true

      - name: Install Tauri CLI
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: tauri-cli

      # android/ is its own workspace with its own version; keep the APK's
      # versionName in step with the release the same way the desktop job does.
      - name: Sync version into the android crate
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' android/src-tauri/tauri.conf.json > android/src-tauri/tauri.conf.json.tmp
          mv android/src-tauri/tauri.conf.json.tmp android/src-tauri/tauri.conf.json
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" android/src-tauri/Cargo.toml
          rm android/src-tauri/Cargo.toml.bak

      # gen/android/tauri.settings.gradle and generated/TauriActivity.kt are
      # gitignored and machine-specific, so a raw checkout can never build (gradle
      # fails with "Unresolved reference: TauriActivity"). init also rewrites the
      # tracked gradle/res files, so restore those immediately after.
      - name: Regenerate the gitignored Android codegen
        shell: bash
        working-directory: android
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo-tauri android init
          git checkout -- src-tauri/gen/android

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is unset, so this run builds a DEBUG apk and attaches nothing to the release. Set the four ANDROID_KEYSTORE_*/ANDROID_KEY_* secrets to ship a signed one."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/conductor-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/conductor-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # google-services.json is gitignored (it ties the APK to one Firebase
      # project), so CI writes it from a secret. The app module applies the
      # google-services plugin unconditionally, so a build without it cannot
      # succeed: fail here, where the reason is readable.
      - name: Write google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is unset. The Android build needs google-services.json (Firebase project claude-conductor-62582); set the secret to the base64 of that file."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 -d > android/src-tauri/gen/android/app/google-services.json

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # ring's build script cannot find the NDK clang without these four, and
          # the failure reads like a broken dependency. 28 matches minSdkVersion in
          # android/src-tauri/tauri.conf.json.
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android28-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          # The .aab is what Google Play takes; the .apk stays for the GitHub release.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cargo-tauri android build --target aarch64 --apk --aab
          else
            cargo-tauri android build --target aarch64 --apk --debug
          fi

      - name: Stage APK
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          SLUG="${{ needs.check.outputs.product_slug }}"
          mkdir -p release-staging
          APK=$(find android/src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found under app/build/outputs/apk" >&2
            exit 1
          fi
          cp "$APK" "release-staging/${SLUG}_${VERSION}_android_arm64.apk"

      # Named release-* so the publish job's download pattern picks it up. Staging
      # holds only the .apk: publish treats every *.json there as an updater
      # platform entry, and the APK has no updater channel.
      - name: Upload artifacts
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android-arm64
          path: release-staging/

      # Not release-*: Play takes the .aab, the GitHub release page does not need
      # it. Kept as an artifact because Play only accepts a brand-new app's FIRST
      # bundle through Play Console by hand, never through the API. Like the
      # upload below, a missing AAB must not hold back the APK's GitHub release.
      - name: Find the release AAB
        id: aab
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          AAB=$(find android/src-tauri/gen/android/app/build/outputs/bundle -name '*-release.aab' | head -n 1)
          if [ -z "$AAB" ]; then
            echo "No release AAB found under app/build/outputs/bundle" >&2
            exit 1
          fi
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Keep the AAB
        if: steps.signing.outputs.signed == 'true' && steps.aab.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab
          path: ${{ steps.aab.outputs.path }}

      # Off until PLAY_SERVICE_ACCOUNT_JSON exists, so adding that secret is the
      # switch that turns on publishing to Play's internal testing track.
      # A Play refusal (version clash, draft app) must not hold back the GitHub
      # release of the APK this job already built, which needs this job green.
      - name: Upload to Google Play internal testing
        if: steps.signing.outputs.signed == 'true' && steps.aab.outputs.path != ''
        continue-on-error: true
        shell: bash
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SA_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is unset, so this release is not uploaded to Google Play."
            exit 0
          fi
          bash scripts/play-upload.test.sh
          printf '%s' "$PLAY_SA_JSON" > "$RUNNER_TEMP/play-sa.json"
          bash scripts/play-upload.sh "$RUNNER_TEMP/play-sa.json" com.sirbepy.conductor.mobile \
            "${{ steps.aab.outputs.path }}" internal completed

      # Deliberately NOT release-*: an unsigned debug build must never reach the
      # release page, but it is still worth keeping for inspection.
      - name: Upload unsigned debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-apk
          path: android/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # Creates the release and makes it "latest" with a Windows-only latest.json, so
  # Windows ships without waiting for macOS or Android. `tag` already required a
  # green `test` and the Windows build. Until publish-macos lands, the updater
  # endpoint has no darwin-aarch64 entry and tauri-plugin-updater returns an
  # error for a Mac client (not "no update"): it clears when macOS finishes.
  publish-windows:
    needs: [check, tag, build-windows]
    if: ${{ !cancelled() && needs.check.outputs.should_release == 'true' && needs.build-windows.result == 'success' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the release with the job token.
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          name: release-windows-x86_64

      - name: Generate latest.json
        shell: bash
        working-directory: artifacts
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLATFORMS="{}"
          for f in *.json; do
            KEY="${f%.json}"
            PLATFORMS=$(jq --arg k "$KEY" --slurpfile p "$f" \
              '. + {($k): $p[0]}' <<< "$PLATFORMS")
          done
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $VERSION" \
            --arg pub_date "$DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > latest.json
          cat latest.json

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.exe.sig
            artifacts/latest.json
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.product_name }} v${{ needs.check.outputs.version }}
          draft: false
          make_latest: "true"

  # Adds macOS to the release publish-windows created; never publishes alone, and
  # `gh run rerun --failed` reruns just this leg if macOS fails. The assets go up
  # first so they exist before latest.json points at them; latest.json goes last
  # because replacing it deletes and re-uploads it (GitHub has no atomic asset
  # replace), a window of a few seconds where the updater URL answers 404.
  publish-macos:
    needs: [check, publish-windows, build-macos]
    if: ${{ !cancelled() && needs.check.outputs.should_release == 'true' && needs.publish-windows.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Every platform's staged files, not just macOS: latest.json is rebuilt from
      # this run's artifacts instead of read back from the live release. If a
      # swap ever dies after the old latest.json was deleted, a rerun of this job
      # would otherwise have nothing to download and merge into.
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          pattern: release-*
          merge-multiple: true

      - name: Generate latest.json with every platform
        shell: bash
        working-directory: artifacts
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PLATFORMS="{}"
          for f in *.json; do
            KEY="${f%.json}"
            PLATFORMS=$(jq --arg k "$KEY" --slurpfile p "$f" \
              '. + {($k): $p[0]}' <<< "$PLATFORMS")
          done
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Release $VERSION" \
            --arg pub_date "$DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version:$version, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > latest.json
          cat latest.json

      - name: Upload macOS assets
        shell: bash
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            artifacts/*.dmg artifacts/*.app.tar.gz artifacts/*.app.tar.gz.sig

      # --clobber deletes the old latest.json before uploading the new one, so a
      # failed upload would leave the release without it and every client's update
      # check would 404. Retry so a transient API error does not strand that state.
      - name: Swap in the merged latest.json
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/latest.json; then
              exit 0
            fi
            echo "latest.json upload failed (attempt $attempt of 3)"
            sleep $((attempt * 5))
          done
          exit 1

  # Named upload-*, not publish-*, so the build watcher's skipped-publish check
  # does not fire on the many releases where android/ is unchanged and this is
  # skipped. Needs publish-windows so the release exists, but nothing waits on it.
  upload-android:
    needs: [check, publish-windows, android]
    if: ${{ !cancelled() && needs.check.outputs.should_release == 'true' && needs.publish-windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      # A pattern, not a name: an unsigned android run uploads no release-*
      # artifact, and a missing name would fail the job instead of attaching nothing.
      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          pattern: release-android-*
          merge-multiple: true

      - name: Attach the APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=(artifacts/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No signed APK was staged; nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${apks[@]}"
