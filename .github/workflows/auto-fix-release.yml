name: Auto-Fix Release Failure

# Watches the Tauri Release workflow on master. If a build-side job fails (a red
# `test` job alone is left for a human, see "Determine failure scope"), pulls the failed
# step logs, hands them to Claude Code, lets it patch the repo, and pushes the
# fix back to master so Tauri Release re-runs. Hard-capped at 2 consecutive
# auto-fix commits to prevent loops.

on:
  workflow_run:
    workflows: ["Tauri Release"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read
  # The Claude Code Action authenticates by exchanging a GitHub OIDC token;
  # without this the step dies on "Could not fetch an OIDC token" before it runs.
  id-token: write

jobs:
  fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check retry cap
        id: cap
        shell: bash
        run: |
          # Count consecutive AUTO-FIX commits at HEAD. If >=2, give up so we
          # don't ping-pong forever on a failure Claude can't solve.
          count=0
          for sha in $(git log -n 5 --format='%H'); do
            msg=$(git log -1 --format='%s' "$sha")
            if [[ "$msg" == AUTO-FIX:* ]]; then
              count=$((count+1))
            else
              break
            fi
          done
          echo "consecutive=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Auto-fix cap reached ($count consecutive AUTO-FIX commits). Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine failure scope
        id: scope
        if: steps.cap.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Auto-fix covers build-side breakage only. An unattended patch for a red
          # test tends to weaken the assertion, and this repo has known vitest
          # flakes. Allowlisting build-side jobs fails CLOSED: a renamed or new
          # job skips auto-fix rather than silently re-admitting test failures.
          # Guarded: under the runner's `bash -e`, an unguarded failing $(...) would
          # abort the step red with no explanation.
          if ! failed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --paginate --jq '.jobs[] | select(.conclusion=="failure") | .name'); then
            echo "::warning::Could not list this run's job results; skipping auto-fix."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Workflow commands are line-parsed, so a multi-line list would truncate.
          failed_csv=$(printf '%s' "$failed" | tr '\n' ',' | sed 's/,$//')
          echo "::notice::Failed jobs: ${failed_csv:-<none>}"
          allow=false
          while IFS= read -r job; do
            [ -z "$job" ] && continue
            # Only the matrix jobs need a wildcard ("build (windows-latest, ...)").
            case "$job" in
              check|build*|android*|tag|publish) allow=true ;;
            esac
          done <<< "$failed"
          if [ "$allow" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Only non-build jobs failed (e.g. test). The red test blocks the release and needs a human; auto-fix will not run."
          fi

      - name: Fetch failed logs
        if: steps.cap.outputs.skip == 'false' && steps.scope.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run view ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --log-failed > failure-full.log || true
          # Trim to last 600 lines so the prompt fits comfortably in context.
          tail -n 600 failure-full.log > failure.log
          rm failure-full.log
          echo "=== failure.log preview ==="
          head -n 30 failure.log

      - name: Run Claude Code
        if: steps.cap.outputs.skip == 'false' && steps.scope.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The Tauri Release workflow (run id ${{ github.event.workflow_run.id }}) just failed on master.

            Read `failure.log` in the repo root for the trimmed failed-step output.
            Identify the root cause and patch the codebase to fix it.

            Hard rules:
            - Do NOT bump the version in package.json, src-tauri/Cargo.toml, or src-tauri/tauri.conf.json.
            - Do NOT skip tests, pre-commit hooks, or signing.
            - Do NOT delete or comment out code merely to make the build pass.
            - Do NOT touch unrelated files. Stay scoped to the failure.
            - If the failure is environmental (transient apt mirror error, runner outage, rate limit) and not a code defect, make zero changes.
            - If the root cause is unclear from the log, make zero changes rather than guessing.

      - name: Commit and push fix
        if: steps.cap.outputs.skip == 'false' && steps.scope.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f failure.log
          if git diff --quiet && git diff --cached --quiet; then
            echo "Claude made no changes; nothing to commit. Likely a transient/environmental failure."
            exit 0
          fi
          git add -A
          attempt=$(( ${{ steps.cap.outputs.consecutive }} + 1 ))
          git commit -m "AUTO-FIX: attempt ${attempt}/2 - patch release CI failure (run ${{ github.event.workflow_run.id }})"
          git push origin master
